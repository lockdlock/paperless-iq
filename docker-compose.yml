name: paperless

services:
  paperless-iq:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PIQ_EXTRAS: ${PIQ_EXTRAS:-qdrant-hybrid,rerank-local}

    restart: unless-stopped
    env_file: .env
    ports:
      - "0.0.0.0:8082:8080"

    volumes:
      - paperless-iq-data:/data

    environment:

      ############################################################
      # Paperless-NGX
      ############################################################

      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN}


      ############################################################
      # Database
      ############################################################

      DATABASE_URL: sqlite+aiosqlite:////data/paperless_iq.db


      ############################################################
      # Model cache
      ############################################################

      HF_HOME: /data/hf-cache


      ############################################################
      # Security
      ############################################################

      # SECRET_KEY: ${SECRET_KEY}


      ############################################################
      # Qdrant
      ############################################################

      PIQ_VECTOR_STORE_BACKEND: ${PIQ_VECTOR_STORE_BACKEND}

      PIQ_QDRANT_MODE: ${PIQ_QDRANT_MODE}

      PIQ_QDRANT_URL: ${PIQ_QDRANT_URL}

      PIQ_QDRANT_COLLECTION: ${PIQ_QDRANT_COLLECTION}

      PIQ_QDRANT_MEMORY_COLLECTION: ${PIQ_QDRANT_MEMORY_COLLECTION}

      PIQ_QDRANT_HYBRID_SEARCH: ${PIQ_QDRANT_HYBRID_SEARCH}

      PIQ_QDRANT_HNSW_EF: ${PIQ_QDRANT_HNSW_EF}

      PIQ_QDRANT_HNSW_M: ${PIQ_QDRANT_HNSW_M}

      PIQ_QDRANT_QUANTIZATION: ${PIQ_QDRANT_QUANTIZATION}


      ############################################################
      # Reranker
      ############################################################

      #PIQ_RERANK_ENABLED: ${PIQ_RERANK_ENABLED}

      #PIQ_RERANK_METHOD: ${PIQ_RERANK_METHOD}

      #PIQ_RERANK_TOP_K: ${PIQ_RERANK_TOP_K}

      #PIQ_RERANK_MODEL: ${PIQ_RERANK_MODEL}


      ############################################################
      # Automation
      ############################################################

      PIQ_AUTOMATION_ENABLED: ${PIQ_AUTOMATION_ENABLED}

      PIQ_AUTO_APPLY: ${PIQ_AUTO_APPLY}

      PIQ_INBOX_TAG_ID: ${PIQ_INBOX_TAG_ID}

      PIQ_POLL_INTERVAL_SECONDS: ${PIQ_POLL_INTERVAL_SECONDS}

      PIQ_BATCH_SIZE: ${PIQ_BATCH_SIZE}


volumes:
  paperless-iq-data: